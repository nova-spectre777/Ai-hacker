name: CIRL Quality Checks

on:
  push:
    branches:
      - main
      - professional-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging and project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,web]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q src scripts cyber-lab
