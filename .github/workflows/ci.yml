name: Code Integrity Research Lab CI

on:
  push:
    branches:
      - main
      - professional-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and compile (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,web]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall -q src scripts cyber-lab
